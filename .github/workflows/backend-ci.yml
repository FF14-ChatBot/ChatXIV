name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "packages/cdm/**"
      - ".dockerignore"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "packages/cdm/**"
      - ".dockerignore"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-test-lint-coverage-audit:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci || npm install

      - name: Install Rollup native binding (npm optional deps bug)
        run: npm install @rollup/rollup-linux-x64-gnu --no-save

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build CDM
        run: npx tsc -p ../packages/cdm/tsconfig.json

      - name: Test
        run: npm run test

      - name: Coverage
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm run audit

      - name: Docker build
        working-directory: .
        run: docker build -f backend/Dockerfile .
